name: Auto Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands to Update EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting automated deployment on AWS EC2..."
            if [ -d "$HOME/cctv-person-detector-ai" ]; then
              cd "$HOME/cctv-person-detector-ai"
            fi
            git pull origin main
            source venv/bin/activate || true
            pkill -f uvicorn || true
            nohup python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
            echo "✅ Deployment complete! Server updated and restarted on port 8000."
