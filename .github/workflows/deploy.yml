name: Auto Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "🚀 Deployment started on EC2..."
            if [ -d "$HOME/cctv-person-detector-ai" ]; then
              cd "$HOME/cctv-person-detector-ai"
            fi
            git pull origin main
            if [ -f "venv/bin/activate" ]; then
              source venv/bin/activate
            fi
            pkill -f uvicorn || true
            sleep 1
            nohup python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
            echo "✅ Deployment complete!"
          EOF
