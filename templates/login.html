<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentinel AI - Authentication Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #050811;
            --bg-card: rgba(14, 22, 38, 0.92);
            --border-color: rgba(0, 240, 255, 0.2);
            --border-glow: rgba(0, 240, 255, 0.4);
            --cyan-primary: #00F0FF;
            --cyan-glow: rgba(0, 240, 255, 0.25);
            --emerald-accent: #10B981;
            --threat-red: #FF2E54;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --font-mono: 'JetBrains Mono', monospace;
            --font-hud: 'Chakra Petch', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            overflow-x: hidden;
        }

        /* Toast Container */
        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-card {
            background: rgba(10, 16, 28, 0.96);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--cyan-primary);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 300px;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast-card.success { border-left-color: var(--emerald-accent); }
        .toast-card.error { border-left-color: var(--threat-red); }

        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Auth Card Container */
        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.12), 0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .auth-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(99, 102, 241, 0.35));
            border: 1px solid var(--cyan-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px var(--cyan-glow);
            color: var(--cyan-primary);
        }

        .brand-title {
            font-family: var(--font-hud);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: linear-gradient(to right, #FFFFFF, var(--cyan-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* Auth Nav Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(6, 11, 20, 0.8);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        .auth-tab-btn {
            flex: 1;
            padding: 9px 0;
            font-family: var(--font-hud);
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-tab-btn.active {
            color: #FFFFFF;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(99, 102, 241, 0.3));
            border: 1px solid var(--cyan-primary);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* Alert Banner */
        .alert-banner {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            display: none;
            line-height: 1.35;
        }

        .alert-banner.error {
            background: rgba(255, 46, 84, 0.12);
            border: 1px solid rgba(255, 46, 84, 0.4);
            color: #FF6B8B;
        }

        .alert-banner.success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34D399;
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 0.75rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .form-input {
            width: 100%;
            background: rgba(8, 14, 26, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px 10px 38px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--cyan-primary);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--cyan-primary), #00A3FF);
            color: #030712;
            font-family: var(--font-hud);
            font-size: 0.92rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 16px var(--cyan-glow);
            transition: all 0.2s ease;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 22px rgba(0, 240, 255, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .demo-hint {
            margin-top: 14px;
            padding: 10px;
            background: rgba(0, 240, 255, 0.04);
            border: 1px dashed rgba(0, 240, 255, 0.25);
            border-radius: 6px;
            font-size: 0.72rem;
            font-family: var(--font-mono);
            color: var(--cyan-primary);
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-logo">
                <i data-lucide="shield-alert" style="width: 28px; height: 28px;"></i>
            </div>
            <div>
                <h1 class="brand-title">SENTINEL AI HUB</h1>
                <p class="brand-subtitle">Visual Security Authentication</p>
            </div>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('LOGIN')">Sign In</button>
            <button class="auth-tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('REGISTER')">Create Account</button>
        </div>

        <div id="alertBanner" class="alert-banner"></div>

        <!-- 1. LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="loginUsername" class="form-input" placeholder="admin" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePass('loginPassword', this)">
                        <i data-lucide="eye" style="width: 14px; height: 14px;"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnLoginSubmit" class="submit-btn">
                <i data-lucide="log-in" style="width: 16px; height: 16px;"></i> Authenticate & Enter
            </button>
        </form>

        <!-- 2. REGISTER FORM -->
        <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label">Full Name / Username</label>
                <div class="input-wrapper">
                    <i data-lucide="user-plus"></i>
                    <input type="text" id="regUsername" class="form-input" placeholder="john_doe" required minlength="3">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <i data-lucide="mail"></i>
                    <input type="email" id="regEmail" class="form-input" placeholder="john@company.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password (Min 6 chars)</label>
                <div class="input-wrapper">
                    <i data-lucide="key"></i>
                    <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePass('regPassword', this)">
                        <i data-lucide="eye" style="width: 14px; height: 14px;"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnRegisterSubmit" class="submit-btn">
                <i data-lucide="user-check" style="width: 16px; height: 16px;"></i> Create Sentinel Account
            </button>
        </form>

        <div class="demo-hint">
            <strong>Default Credentials:</strong><br>
            Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function switchAuthTab(mode) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLoginBtn');
            const tabReg = document.getElementById('tabRegisterBtn');
            const banner = document.getElementById('alertBanner');

            banner.style.display = 'none';

            if (mode === 'LOGIN') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                tabLogin.classList.remove('active');
                tabReg.classList.add('active');
            }
        }

        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        function showAlert(msg, type = 'error') {
            const banner = document.getElementById('alertBanner');
            banner.className = `alert-banner ${type}`;
            banner.innerText = msg;
            banner.style.display = 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLoginSubmit');
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showAlert('Please enter both username and password.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Authenticating...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert('Authentication successful! Loading AI Sentinel Hub...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    showAlert(data.error || data.detail || 'Invalid username or password. Please try again.');
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="log-in" style="width: 16px; height: 16px;"></i> Authenticate & Enter';
                    lucide.createIcons();
                }
            } catch (err) {
                showAlert('Network request failed: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="log-in" style="width: 16px; height: 16px;"></i> Authenticate & Enter';
                lucide.createIcons();
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegisterSubmit');
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!username || !email || !password) {
                showAlert('Please complete all registration fields.');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Registering User...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert('Account created successfully! Auto-authenticating...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 700);
                } else {
                    showAlert(data.error || data.detail || 'Registration failed. Username or email may already exist.');
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="user-check" style="width: 16px; height: 16px;"></i> Create Sentinel Account';
                    lucide.createIcons();
                }
            } catch (err) {
                showAlert('Registration request failed: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="user-check" style="width: 16px; height: 16px;"></i> Create Sentinel Account';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
